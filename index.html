<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Welcome</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --text: #172033;
            --muted: #667085;
            --border: #d9deea;
            --background: #f4f7fb;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: linear-gradient(135deg, #eef2ff, var(--background));
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-card {
            width: min(100%, 420px);
            padding: 40px;
            background: #ffffff;
            border: 1px solid #e8ebf2;
            border-radius: 18px;
            box-shadow: 0 18px 45px rgba(31, 41, 75, 0.12);
        }

        .brand {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            margin-bottom: 22px;
            border-radius: 13px;
            background: var(--primary);
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        h1 { margin: 0 0 8px; font-size: 29px; }
        .subtitle { margin: 0 0 30px; color: var(--muted); }

        label {
            display: block;
            margin: 18px 0 8px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--border);
            border-radius: 9px;
            color: var(--text);
            font-size: 15px;
            outline: none;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px #e0e7ff; }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0 24px;
            font-size: 13px;
        }

        .remember { display: flex; gap: 8px; align-items: center; color: var(--muted); }
        .remember input { width: auto; accent-color: var(--primary); }
        a { color: var(--primary); font-weight: bold; text-decoration: none; }
        a:hover { text-decoration: underline; }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 9px;
            background: var(--primary);
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: var(--primary-dark); }
        .signup { margin: 25px 0 0; color: var(--muted); text-align: center; font-size: 14px; }

        @media (max-width: 480px) { .login-card { padding: 30px 24px; } }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="brand" aria-hidden="true">✓</div>
        <h1>Welcome devops class</h1>
        <p class="subtitle">Sign in to continue to your account.</p>

        <form>
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>

            <div class="options">
                <label class="remember"><input type="checkbox" name="remember"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit">Sign in</button>
        </form>
        <p class="signup">Don't have an account? <a href="#">Create one</a></p>
    </main>
</body>
</html>
